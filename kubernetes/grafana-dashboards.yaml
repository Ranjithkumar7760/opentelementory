                "fillOpacity": 15,
                "gradientMode": "opacity"
              },
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
